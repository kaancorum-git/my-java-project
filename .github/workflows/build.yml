jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # Specify the JDK distribution (e.g., 'temurin', 'zulu', etc.)
          java-version: '17'      # Specify the Java version
          java-package: 'jdk'     # Specify the Java package (e.g., 'jdk', 'jre')
          check-latest: false     # Optional: Whether to check for the latest version
          server-id: github       # Optional: Server ID for Maven settings
          server-username: ${{ secrets.GITHUB_ACTOR }}
          server-password: ${{ secrets.GITHUB_TOKEN }}
          overwrite-settings: true
