jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # Specify the JDK distribution (e.g., 'temurin', 'zulu', etc.)
          java-version: '17'      # Specify the Java version
