# Application Info
spring.application.name=portfolio-service
server.port=8081

# Build Info
build.info.file=/app/build-info.properties

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Web MVC
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# Logging
logging.level.com.example.portfolio=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=ERROR

# Application Info for Actuator
info.app.name=Portfolio Service
info.app.description=Professional Spring Boot Portfolio Application
info.app.version=1.0.0
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@
