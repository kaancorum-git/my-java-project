# Application Info
spring.application.name=portfolio-service
server.port=8081
spring.profiles.active=dev

# Build Info
build.info.file=/app/build-info.properties

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,ping
management.metrics.tags.application=${spring.application.name}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Web MVC
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# Logging
logging.level.com.example.portfolio=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=ERROR

# Application Info for Actuator
info.app.name=Portfolio Service
info.app.description=Professional Spring Boot Portfolio Application
info.app.version=1.0.0
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@
