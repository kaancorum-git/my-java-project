<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Portfolio Item</title>
    <link rel="stylesheet" href="/css/portfolio.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/gallery">Portfolio</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card" style="max-width: 900px; margin: 2rem auto;">
            <img th:src="${item.imageUrl}" th:alt="${item.title}" 
                 style="width: 100%; height: 300px; object-fit: cover; border-radius: 8px; 
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            
            <h1 th:text="${item.title}" style="margin-top: 1.5rem;">Project Title</h1>
            <p style="color: var(--primary-color); font-weight: 600; font-size: 1.1rem;" 
               th:text="${item.category}">Category</p>
            
            <p style="line-height: 1.8; color: var(--text-light); font-size: 1.1rem; margin-top: 1rem;" 
               th:text="${item.description}">Project description</p>
            
            <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Technologies Used</h3>
            <div class="tech-tags" style="justify-content: center;">
                <span class="tech-tag" th:each="tech : ${item.technologies}" th:text="${tech}">Tech</span>
            </div>
            
            <div style="margin-top: 2rem; text-align: center;">
                <a th:href="${item.projectUrl}" target="_blank" 
                   style="padding: 0.75rem 2rem; background-color: var(--primary-color); 
                          color: white; border-radius: 4px; text-decoration: none; 
                          display: inline-block;">View Project</a>
                <a href="/gallery" 
                   style="padding: 0.75rem 2rem; background-color: var(--text-light); 
                          color: white; border-radius: 4px; text-decoration: none; 
                          display: inline-block; margin-left: 1rem;">Back to Gallery</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Kaan Corum | Portfolio Service v1.0.0</p>
    </footer>
</body>
</html>
