<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            color: #4CAF50;
        }
        a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }
        a:hover {
            color: #45a049;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1 th:text="${title}"></h1>
    <p th:text="${description}"></p>
    <p>Build Number: <span th:text="${buildNumber}"></span></p>
    <p>Branch Name: <span th:text="${branchName}"></span></p>

    <div class="links">
        <h2>Explore Our Pages</h2>
        <a href="/tutorial">Go to Tutorial Page</a>
        <a href="/about">About Us</a>
        <a href="/contact">Contact Us</a>
        <a href="/services">Our Services</a>
        <a href="/gallery">Gallery</a>
    </div>
</body>
</html>
