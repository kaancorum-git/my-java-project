<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Contact Me</title>
    <link rel="stylesheet" href="/css/portfolio.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/gallery">Portfolio</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <header>
            <h1 th:text="${title}">Contact Me</h1>
            <p class="subtitle" th:text="${description}">Get in touch for collaboration opportunities</p>
        </header>

        <div class="info-section" style="margin-bottom: 3rem;">
            <div class="info-box" style="text-align: center;">
                <h3>📧 Email</h3>
                <p><a th:href="'mailto:' + ${email}" th:text="${email}" 
                      style="color: var(--primary-color);">kaan@example.com</a></p>
            </div>
            <div class="info-box" style="text-align: center;">
                <h3>🔗 GitHub</h3>
                <p><a th:href="${github}" target="_blank" 
                      style="color: var(--primary-color);">View Profile</a></p>
            </div>
            <div class="info-box" style="text-align: center;">
                <h3>💼 LinkedIn</h3>
                <p><a th:href="${linkedin}" target="_blank" 
                      style="color: var(--primary-color);">Connect</a></p>
            </div>
        </div>

        <form>
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Send a Message</h2>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            <div style="text-align: center;">
                <button type="submit">Send Message</button>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Kaan Corum | Portfolio Service v1.0.0</p>
    </footer>
</body>
</html>
